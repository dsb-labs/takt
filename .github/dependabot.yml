version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/internal/ui/app"
    schedule:
      interval: weekly
    groups:
      ui:
        patterns:
          - "*"
    ignore:
      # typescript-eslint refuses to run against TypeScript 7. Remove this
      # once https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # lands support.
      - dependency-name: typescript
        versions: [">=7.0"]
