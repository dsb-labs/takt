name: e2e

concurrency:
  group: ${{ github.workflow }}/${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - 'Makefile'
      - 'scripts/delegated.sh'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - 'Makefile'
      - 'scripts/delegated.sh'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The e2e target wraps the run in a systemd scope with a delegated cgroup
      # subtree, which needs the runner user to have a systemd user manager and
      # its bus. Lingering starts one for a user with no login session, which is
      # what a runner is.
      - name: Delegate a cgroup subtree
        run: |
          sudo loginctl enable-linger "$(whoami)"
          for _ in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Run end-to-end tests
        run: make e2e

      - name: Upload debug bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug-bundles
          path: internal/e2e/artifacts/
