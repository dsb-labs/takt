name: e2e

concurrency:
  group: ${{ github.workflow }}/${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - 'Makefile'
      - 'scripts/delegated.sh'
      - '.github/workflows/e2e.yml'
      - '.github/actions/setup-go/action.yml'
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - 'Makefile'
      - 'scripts/delegated.sh'
      - '.github/workflows/e2e.yml'
      - '.github/actions/setup-go/action.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The driver speaks the Docker Engine API, which Podman also serves. Each
    # daemon gets its own run so that a Podman failure names the daemon rather
    # than hiding inside a run that works on Docker.
    strategy:
      fail-fast: false
      matrix:
        daemon:
          - docker
          - podman
    # Podman does not block a merge yet. The job runs to collect what fails
    # there, and becomes blocking once the driver refuses what Podman cannot do.
    continue-on-error: ${{ matrix.daemon == 'podman' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: e2e

      # The server reads DOCKER_HOST when the configuration names no host, and
      # the harness shells out to the docker CLI, which reads the same variable.
      # Setting it once points both at Podman. The socket and its directory are
      # root-only, so the runner user is let in by mode rather than by running
      # everything as root.
      - name: Start Podman
        if: matrix.daemon == 'podman'
        env:
          DOCKER_HOST: unix:///run/podman/podman.sock
        run: |
          sudo systemctl enable --now podman.socket
          sudo chmod 755 /run/podman
          sudo chmod 666 /run/podman/podman.sock
          ls -ld /run/podman /run/podman/podman.sock
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          docker version

      - name: Run end-to-end tests
        run: make e2e
        env:
          # The runner's images are disposable, so the test that prunes them
          # may run here. It skips itself anywhere this is unset.
          TAKT_E2E_PRUNE: "1"

      - name: Upload debug bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug-bundles-${{ matrix.daemon }}
          path: internal/e2e/artifacts/

      # One save is enough: both runs compile the same objects.
      - name: Save the Go caches
        if: always() && matrix.daemon == 'docker'
        uses: ./.github/actions/setup-go
        with:
          mode: save
          cache-name: e2e
