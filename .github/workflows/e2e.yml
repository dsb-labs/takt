name: e2e

concurrency:
  group: ${{ github.workflow }}/${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - 'Makefile'
      - 'scripts/delegated.sh'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - 'Makefile'
      - 'scripts/delegated.sh'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run end-to-end tests
        run: make e2e

      - name: Upload debug bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug-bundles
          path: internal/e2e/artifacts/
