name: go

concurrency:
  group: ${{ github.workflow }}/${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - '.github/workflows/go.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run linter
        run: go tool staticcheck ./...

      - name: Run generators
        run: |
          go generate ./...
          git add .
          git diff --staged --exit-code

      # The exec driver's resource limit tests re-execute themselves under
      # systemd-run with Delegate=yes, which needs the runner user to have a
      # systemd user manager and its bus. Lingering starts one for a user with
      # no login session, which is what a runner is.
      - name: Delegate a cgroup subtree
        run: |
          sudo loginctl enable-linger "$(whoami)"
          for _ in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Run tests
        run: go test -short -race ./...
