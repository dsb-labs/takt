name: loadtest

concurrency:
  group: ${{ github.workflow }}/${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - 'scenarios/**'
      - 'dev.toml'
      - 'Makefile'
      - 'scripts/delegated.sh'
      - '.github/workflows/loadtest.yml'
      - '.github/actions/setup-go/action.yml'
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - 'scenarios/**'
      - 'dev.toml'
      - 'Makefile'
      - 'scripts/delegated.sh'
      - '.github/workflows/loadtest.yml'
      - '.github/actions/setup-go/action.yml'
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

jobs:
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: loadtest

      - name: Build takt
        run: go build -o takt .

      - name: Start the server
        run: |
          make dev > server.log 2>&1 &
          ./takt admin health --wait 30s

      - name: Run the smoke load test
        run: ./takt dev loadtest scenarios/smoke.toml --address http://localhost:7373 --data-dir "${{ github.workspace }}/data" > report.json

      - name: Report
        if: always()
        run: cat report.json || true

      - name: Upload the report and server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-output
          path: |
            report.json
            server.log

      - name: Save the Go caches
        if: always()
        uses: ./.github/actions/setup-go
        with:
          mode: save
          cache-name: loadtest
