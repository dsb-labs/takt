name: loadtest

concurrency:
  group: ${{ github.workflow }}/${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - 'scenarios/**'
      - 'dev.toml'
      - 'Makefile'
      - 'scripts/delegated.sh'
      - '.github/workflows/loadtest.yml'
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'api/openapi.yaml'
      - 'api/oapi-codegen.yaml'
      - '.mockery.yml'
      - 'scenarios/**'
      - 'dev.toml'
      - 'Makefile'
      - 'scripts/delegated.sh'
      - '.github/workflows/loadtest.yml'
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

jobs:
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build orca
        run: go build -o orca .

      # Started in the background rather than as a service container, because the
      # load test drives the build under test. A released image would measure
      # whatever was last published.
      #
      # Through make dev and its dev.toml, so the run exercises exactly the server
      # a developer load-tests locally: delegated, able to enforce resource limits
      # the way a production server under systemd can, and keeping its data in the
      # workspace's data directory. The server resolves that path and creates it.
      - name: Start the server
        run: |
          make dev > server.log 2>&1 &
          ./orca admin health --wait 30s

      # The smoke scenario, which is a few of every feature and takes seconds. The
      # larger scenarios are for running by hand: they measure how fast a machine is
      # as much as anything else, and a shared runner is not a machine worth
      # measuring.
      #
      # The data directory is passed so that the run also reports what was left on
      # disk after teardown. That check is the only one that sees a leaked mount
      # directory, and it needs the server's own host.
      - name: Run the smoke load test
        run: ./orca dev loadtest scenarios/smoke.toml --data-dir "${{ github.workspace }}/data" > report.json

      - name: Report
        if: always()
        run: cat report.json || true

      - name: Upload the report and server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-output
          path: |
            report.json
            server.log
