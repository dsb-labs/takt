# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: api
output: internal/generated/api/api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  client: true
output-options:
  name-normalizer: ToCamelCaseWithInitialisms
# The generated handler wrappers put each operation's required scopes into the
# request context, which is how the authorization middleware learns the role an
# operation needs without a second copy of the OpenAPI document's security
# declarations.
compatibility:
  enable-auth-scopes-on-context: true
