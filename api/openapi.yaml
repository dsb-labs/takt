openapi: 3.1.0

info:
  title: takt
  description: |
    takt is a single-node workload orchestrator. Workloads are submitted as desired
    state and continuously reconciled against the runtime so that what is running
    matches what was asked for.

    A workload names exactly one runtime block, which selects the driver used to run
    it.

    A volume is a separate resource with a lifecycle of its own. It is created before
    the workload that mounts it and outlives that workload, so removing stored data is
    always something asked for rather than a consequence of deleting a workload.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:7373
    description: Local takt server.

tags:
  - name: workloads
    description: Submission and inspection of workloads.
  - name: volumes
    description: Storage that outlives the workloads mounting it.
  - name: services
    description: Named selections of workload instances to balance requests across.
  - name: secrets
    description: Values a workload can read and an operator cannot.
  - name: variables
    description: Values both a workload and an operator can read.
  - name: system
    description: Liveness, readiness and metrics for the server itself.
  - name: admin
    description: Operations against the node itself rather than the workloads on it.

paths:
  /api/v1/workloads:
    get:
      operationId: listWorkloads
      tags: [workloads]
      summary: List workloads
      description: |
        Returns the workloads known to the server, with the observed state of each
        one's instances merged in.

        Repeating the `query` parameter narrows the result: a workload is returned
        only when it satisfies every query given.
      parameters:
        - name: query
          in: query
          required: false
          description: |
            A `path=value` filter over the workload's specification, where the path
            is a JSON path such as `$.labels.app`. May be repeated, in which case a
            workload must match all of them.

            Values are compared as text, so a number in the specification is matched
            by its digits (`$.container.ports[0].to=80`). A boolean is stored as 1 or
            0 and must be written that way.
          schema:
            type: array
            items:
              type: string
              examples: ["$.labels.app=web"]
      responses:
        "200":
          description: The matching workloads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWorkloadsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workloads/{name}:
    parameters:
      - $ref: "#/components/parameters/WorkloadName"

    get:
      operationId: getWorkload
      tags: [workloads]
      summary: Get a single workload
      description: |
        Returns the workload with the given name, with the observed state of its
        instances merged in.
      responses:
        "200":
          description: The requested workload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetWorkloadResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: applyWorkload
      tags: [workloads]
      summary: Create or update a workload
      description: |
        Applies the given specification as the desired state for the named workload.
        The operation is idempotent: applying an unchanged specification is a no-op
        that leaves the workload's version untouched, while a changed specification
        increments it and causes the running instances to be replaced.

        The specification's name must match the name in the path.

        Everything the specification names has to exist: a volume it mounts, a secret
        or variable it reads, and a workload whose address it references. One that
        does not is a 400 naming what is missing, rather than a workload stored in a
        state it could never run in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkloadSpec"
      responses:
        "200":
          description: The workload already existed and was updated, or was unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyWorkloadResult"
        "201":
          description: The workload was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyWorkloadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            The workload is being deleted. It cannot be applied again until its
            teardown has finished and it has disappeared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            The specification is well-formed but names a runtime the server cannot
            run yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: |
            The workload needs a host port allocated and none is free. The request
            was valid and becomes servable once a workload is deleted or the
            configured range is widened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteWorkload
      tags: [workloads]
      summary: Delete a workload
      description: |
        Marks the workload for deletion and returns it as it now stands.

        Deletion is asynchronous. The workload is reported as terminating while its
        instances are stopped, and disappears once nothing is left running for it,
        so a caller can watch the teardown by polling the workload until it returns
        404. Applying a workload while it is terminating is rejected.

        A workload another workload references is refused rather than marked, and the
        response names the workloads reading its address. Applying one that references
        a workload which does not exist is also refused, so removing it without this
        check would leave a specification nobody could re-apply.
      parameters:
        - name: force
          in: query
          required: false
          description: |
            Delete the workload even though another references its address. Those
            workloads are redeployed and then report the reference they can no longer
            resolve, retrying until something holds the name again.
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: The workload was marked for deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteWorkloadResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another workload references this one, and force was not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workloads/{name}/logs:
    parameters:
      - $ref: "#/components/parameters/WorkloadName"

    get:
      operationId: getWorkloadLogs
      tags: [workloads]
      summary: Read a workload's logs
      description: |
        Returns the combined output of the workload's instances as plain text, most
        recent last.

        The server keeps the instance it most recently stopped so that the output of
        an attempt that ended is still readable after a replacement has taken its
        place. Set `previous` to read that instead of what is running now, which is
        what a workload restarting repeatedly needs: the current attempt has not
        failed yet, so its output does not say why the workload is failing.
      parameters:
        - name: tail
          in: query
          required: false
          description: |
            The number of lines to return from the end of the logs. Capped, because
            the server reads what it is asked for and an unbounded request would let
            a caller decide how much work the server does.
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
        - name: previous
          in: query
          required: false
          description: |
            Read the instance that was replaced rather than the one running now.

            The two are never combined, because concatenating them would return two
            runs spliced together with nothing marking the boundary. A workload that
            has only ever run once has no earlier attempt, so the response is empty.
          schema:
            type: boolean
            default: false
        - name: follow
          in: query
          required: false
          description: |
            Keep the response open and keep writing output as the workload produces
            it.

            The response ends when the instance ends. A replacement is a new
            instance, so a workload that restarts while you are watching needs a new
            request.

            Cannot be combined with `previous`, which reads an instance that has
            already ended. That request is refused rather than answered as an
            ordinary read, because there is nothing for it to follow.
          schema:
            type: boolean
            default: false
        - name: instance
          in: query
          required: false
          description: |
            Read one instance's output, selected by its index. Omitted reads every
            instance.

            Required with `follow` when the workload runs more than one instance:
            a follow reads one stream until it ends, and interleaving several would
            return output nothing could attribute. An index the workload's count
            does not include is refused.
          schema:
            type: integer
            minimum: 0
        - name: since
          in: query
          required: false
          description: |
            Return only the output written at or after this instant.

            Applies to container workloads. The runtime holds a timestamp for every
            line it keeps, so it can do the filtering itself.

            Ignored for exec workloads. Their output is a plain file with no
            timestamps in it, so a filter would have to run against a time the
            server invented.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The workload's logs.
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workloads/{name}/stop:
    parameters:
      - $ref: "#/components/parameters/WorkloadName"

    post:
      operationId: stopWorkload
      tags: [workloads]
      summary: Stop a workload
      description: |
        Marks the workload as suspended and returns it as it now stands.

        Stopping is asynchronous. The reconciler stops the workload's instances,
        removes any values the workload mounted, and then leaves it alone until it
        is started again. Suspension is desired state, so it survives a server
        restart. Stopping an already suspended workload changes nothing.

        The specification and its version are untouched, so a later start resumes
        the same instance rather than replacing it. Applying a new specification
        while the workload is suspended is allowed, and the replacement it asks for
        happens when the workload is started.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopWorkloadRequest"
      responses:
        "202":
          description: The workload was marked as suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopWorkloadResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The workload is being deleted, so there is nothing left to hold down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workloads/{name}/start:
    parameters:
      - $ref: "#/components/parameters/WorkloadName"

    post:
      operationId: startWorkload
      tags: [workloads]
      summary: Start a stopped workload
      description: |
        Clears the workload's suspension and returns it as it now stands.

        Starting is asynchronous. The next reconcile pass starts the workload's
        instances again, under whatever specification is stored, which includes one
        applied while the workload was suspended. Starting a workload that is not
        suspended changes nothing.

        A scheduled workload counts its next occurrence from when it was started,
        so occurrences missed while it was suspended do not run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartWorkloadRequest"
      responses:
        "202":
          description: The workload's suspension was cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartWorkloadResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The workload is being deleted and cannot run again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workloads/{name}/restart:
    parameters:
      - $ref: "#/components/parameters/WorkloadName"

    post:
      operationId: restartWorkload
      tags: [workloads]
      summary: Restart a workload
      description: |
        Asks the reconciler to replace the workload's running instances, and
        returns the workload as it now stands.

        The restart happens on the next reconcile pass. The instances are stopped
        and new ones are started from the unchanged specification, so the version
        does not move. The request is held in memory rather than stored: one the
        reconciler has not acted on yet is lost when the server restarts, and can
        simply be sent again.

        A suspended workload is refused, since nothing would start. Start it
        instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartWorkloadRequest"
      responses:
        "202":
          description: The restart was recorded for the next reconcile pass.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartWorkloadResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The workload is being deleted or is suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/workloads/{name}/dry-run:
    parameters:
      - $ref: "#/components/parameters/WorkloadName"

    post:
      operationId: dryRunWorkload
      tags: [workloads]
      summary: Report what applying a workload would do
      description: |
        Resolves the given specification exactly as an apply resolves it, reports
        what applying it would change, and writes nothing.

        Everything an apply refuses this refuses too, with the same status code: a
        volume, secret, variable or workload the specification names and nothing
        holds, a pinned host port another workload has, a workload being torn down,
        and a specification that is not runnable. A dry run that passes is therefore
        a statement about the apply rather than about the request.

        A separate route rather than a flag on the apply. A "do not actually write"
        branch through the write path is the version of this that eventually writes
        something by accident.

        Nothing is allocated. A port mapping that needs a host port allocated is
        reported without one, and its path is listed in `unknown`, because allocating
        would consume a port or move a workload's address while reporting that
        nothing had changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkloadSpec"
      responses:
        "200":
          description: What applying the specification would do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DryRunWorkloadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            The workload is being deleted, or the specification pins a host port
            another workload holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            The specification is well-formed but names a runtime the server cannot
            run yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/volumes:
    get:
      operationId: listVolumes
      tags: [volumes]
      summary: List volumes
      description: |
        Returns the volumes the server holds, each with the workloads currently
        mounting it.

        Repeating the `query` parameter narrows the result: a volume is returned
        only when it satisfies every query given.
      parameters:
        - name: query
          in: query
          required: false
          description: |
            A `path=value` filter over the volume's labels, where the path is a
            JSON path such as `$.labels.app`. May be repeated, in which case a
            volume must match all of them. A query can reach only the labels.
          schema:
            type: array
            items:
              type: string
              examples: ["$.labels.app=web"]
      responses:
        "200":
          description: The matching volumes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVolumesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: createVolume
      tags: [volumes]
      summary: Create a volume
      description: |
        Creates a volume and the directory backing it.

        A volume has to exist before a workload can mount it, so that a mistyped
        name is reported rather than silently becoming a second empty volume.
        Creating one that already exists is rejected, because a volume holds data and
        an accidental second create should not read as success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolumeSpec"
      responses:
        "201":
          description: The volume was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVolumeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A volume with that name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/volumes/{name}:
    parameters:
      - $ref: "#/components/parameters/VolumeName"

    get:
      operationId: getVolume
      tags: [volumes]
      summary: Get a single volume
      description: |
        Returns the volume with the given name, including the workloads mounting it.
      responses:
        "200":
          description: The requested volume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVolumeResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: updateVolume
      tags: [volumes]
      summary: Update a volume's labels
      description: |
        Replaces the labels on the volume with the given name.

        The labels are the whole of what a volume has to change. Its name identifies
        it, the directory holding its data is named for the identifier it was
        assigned, and its contents are the workloads' to write.

        The labels given replace the ones stored, as applying a workload manifest
        replaces a workload's. Sending none removes them all.

        Nothing mounting the volume is redeployed. A label says nothing about the
        storage, so no specification hash moves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolumeSpec"
      responses:
        "200":
          description: The updated volume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateVolumeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteVolume
      tags: [volumes]
      summary: Delete a volume and the data it holds
      description: |
        Removes the volume and everything stored in it.

        A volume a workload mounts is refused rather than removed, and the response
        names the workloads holding it. That is what makes deletion deliberate: a
        volume outlives the workloads using it, so nothing else in takt will ever
        remove one.

        Deletion is synchronous, unlike a workload's. There is nothing running to
        wind down, only a directory to remove.
      parameters:
        - name: force
          in: query
          required: false
          description: |
            Remove the volume even though a workload mounts it. The workload keeps
            running and its mount stops resolving, so this is for a volume whose
            workloads are known not to need it.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: |
            The volume and its contents were removed.

            The body is an object with nothing in it yet, rather than no body at all.
            Every other response this API gives is JSON, and one that is not would
            make a caller decoding the body special-case this single status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteVolumeResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A workload mounts the volume, and force was not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/services:
    get:
      operationId: listServices
      tags: [services]
      summary: List services
      description: |
        Returns the services the server holds, each with its backends resolved at
        the time of the request.

        Repeating the `query` parameter narrows the result: a service is returned
        only when it satisfies every query given.
      parameters:
        - name: query
          in: query
          required: false
          description: |
            A `path=value` filter over the service's labels, where the path is a
            JSON path such as `$.labels.app`. May be repeated, in which case a
            service must match all of them. A query can reach only the service's
            own labels, not its target's.
          schema:
            type: array
            items:
              type: string
              examples: ["$.labels.app=web"]
      responses:
        "200":
          description: The matching services.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServicesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/services/{name}:
    parameters:
      - $ref: "#/components/parameters/ServiceName"

    get:
      operationId: getService
      tags: [services]
      summary: Get a single service
      description: |
        Returns the service with the given name, with its backends resolved at the
        time of the request.
      responses:
        "200":
          description: The requested service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetServiceResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: applyService
      tags: [services]
      summary: Create or update a service
      description: |
        Applies the given specification as the desired state for the named service.
        The operation is idempotent: the stored selection becomes what the
        specification says, however many times it is applied.

        The specification's name must match the name in the path.

        The workloads the target selects do not have to exist. A service is a
        question asked of whatever is running, so one applied ahead of its
        workloads reports no backends until they arrive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceSpec"
      responses:
        "200":
          description: The service already existed and was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyServiceResult"
        "201":
          description: The service was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyServiceResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service
      description: |
        Removes the service.

        The workloads it selected are their own resources and keep running. What
        stops is the service reporting their addresses.

        Deletion is synchronous, unlike a workload's. There is nothing running to
        wind down, only a row to remove.
      responses:
        "200":
          description: |
            The service was removed.

            The body is an object with nothing in it yet, rather than no body at
            all, for the reason a deleted volume's is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteServiceResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/secrets:
    get:
      operationId: listSecrets
      tags: [secrets]
      summary: List secrets
      description: |
        Returns the secrets the server holds, each with the workloads currently
        reading it.

        No value is returned, here or anywhere else. This is how an operator finds
        out what exists in order to reference it from a manifest.

        Repeating the `query` parameter narrows the result: a secret is returned
        only when it satisfies every query given.
      parameters:
        - name: query
          in: query
          required: false
          description: |
            A `path=value` filter over the secret's labels, where the path is a
            JSON path such as `$.labels.app`. May be repeated, in which case a
            secret must match all of them. A query can reach only the labels, so
            it cannot probe what a secret holds.
          schema:
            type: array
            items:
              type: string
              examples: ["$.labels.app=web"]
      responses:
        "200":
          description: The matching secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSecretsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/SecretName"

    get:
      operationId: getSecret
      tags: [secrets]
      summary: Get a single secret
      description: |
        Returns the secret with the given name, including the workloads reading it.

        The value is not part of the response. Nothing reads a secret back out of
        takt: once set, the only thing that sees the value is a workload being
        started.
      responses:
        "200":
          description: The requested secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSecretResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: setSecret
      tags: [secrets]
      summary: Set a secret's value
      description: |
        Stores the given value as the named secret, encrypted.

        Setting a secret to the value it already holds does nothing: the revision
        stays put, so no workload reading it is redeployed. That mirrors applying an
        unchanged manifest, and means a tool that sets every secret on every run does
        not restart the fleet each time.

        A value that did change moves the revision, which moves the specification
        hash of every workload reading the secret. Those workloads are then replaced
        by the reconciler, and the new value reaches them as they start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretSpec"
      responses:
        "200":
          description: The secret was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetSecretResult"
        "201":
          description: The secret was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetSecretResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteSecret
      tags: [secrets]
      summary: Delete a secret
      description: |
        Removes the secret with the given name.

        A secret a workload reads is refused rather than removed, and the response
        names the workloads reading it. Forcing it through leaves those workloads
        running: they find out at their next start, which is when the value is
        actually needed.

        Deletion is synchronous, unlike a workload's. There is nothing running to
        wind down, only a row to remove.
      parameters:
        - name: force
          in: query
          required: false
          description: |
            Remove the secret even though a workload reads it. Those workloads keep
            running until something replaces them, and then fail to start until the
            secret exists again.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: |
            The secret was removed.

            The body is an object with nothing in it yet, rather than no body at all,
            for the same reason deleting a volume returns one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSecretResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A workload reads the secret, and force was not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/variables:
    get:
      operationId: listVariables
      tags: [variables]
      summary: List variables
      description: |
        Returns the variables the server holds, each with its value and the workloads
        currently reading it.

        The values are part of the response, unlike a secret's. Being able to review
        what a fleet is configured with is the reason to choose a variable over a
        secret, so a listing that withheld them would defeat the point.

        Repeating the `query` parameter narrows the result: a variable is returned
        only when it satisfies every query given.
      parameters:
        - name: query
          in: query
          required: false
          description: |
            A `path=value` filter over the variable's labels, where the path is a
            JSON path such as `$.labels.app`. May be repeated, in which case a
            variable must match all of them. A query can reach only the labels.
          schema:
            type: array
            items:
              type: string
              examples: ["$.labels.app=web"]
      responses:
        "200":
          description: The matching variables.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVariablesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/variables/{name}:
    parameters:
      - $ref: "#/components/parameters/VariableName"

    get:
      operationId: getVariable
      tags: [variables]
      summary: Get a single variable
      description: |
        Returns the variable with the given name, including its value and the
        workloads reading it.
      responses:
        "200":
          description: The requested variable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVariableResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      operationId: setVariable
      tags: [variables]
      summary: Set a variable's value
      description: |
        Stores the given value as the named variable.

        Setting a variable to the value it already holds does nothing, so no workload
        reading it is redeployed. That mirrors applying an unchanged manifest, and
        means a tool that sets every variable on every run does not restart the fleet
        each time.

        A value that did change moves the specification hash of every workload
        reading the variable. Those workloads are then replaced by the reconciler,
        and the new value reaches them as they start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableSpec"
      responses:
        "200":
          description: The variable was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetVariableResult"
        "201":
          description: The variable was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetVariableResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteVariable
      tags: [variables]
      summary: Delete a variable
      description: |
        Removes the variable with the given name.

        A variable a workload reads is refused rather than removed, and the response
        names the workloads reading it. Forcing it through leaves those workloads
        running: they find out at their next start, which is when the value is
        actually needed.

        Deletion is synchronous, unlike a workload's. There is nothing running to
        wind down, only a row to remove.
      parameters:
        - name: force
          in: query
          required: false
          description: |
            Remove the variable even though a workload reads it. Those workloads keep
            running until something replaces them, and then fail to start until the
            variable exists again.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: |
            The variable was removed.

            The body is an object with nothing in it yet, rather than no body at all,
            for the same reason deleting a secret returns one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteVariableResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A workload reads the variable, and force was not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/backup:
    get:
      operationId: getBackup
      tags: [admin]
      summary: Download a backup of the node
      description: |
        Returns a zip archive holding a consistent snapshot of takt's database,
        taken while the server keeps running.

        The database runs in write-ahead logging mode, so at any moment the
        committed state is spread across `state.db`, `state.db-wal` and
        `state.db-shm`. Copying `state.db` on its own produces a file that is
        stale or torn, and it fails quietly: SQLite opens the result happily and
        the missing transactions are noticed later, if at all. The snapshot in
        this archive is one statement against a live connection, so it holds
        everything committed when the request arrived and nothing that was still
        in flight.

        **Volume data is not in the archive.** Copying arbitrary user data is not
        something takt should do. `GET /api/v1/volumes` reports each volume's path
        on the host for exactly this reason, and backing those up is separate work.

        The files under `mounts/` are not in the archive either. They are transient
        and rewritten as a workload starts.
      parameters:
        - name: includeKeys
          in: query
          required: false
          description: |
            Put the keyring in the archive beside the database.

            Off by default, and the default is the one to prefer. A database
            without its keys decrypts nothing, and that separability is what makes
            a copy of it safe to keep somewhere a key would not be. An archive
            holding both is key material: it opens every secret takt holds, and it
            keeps opening them long after this request.

            Every key is included, not only the one sealing secrets now. A key that
            has been replaced still opens the archives taken before it was, and an
            operator restoring an older backup needs it.

            An operator who set `secrets.keys` to somewhere they already back up
            needs none of this. Setting it is the better answer.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The backup archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/rekey:
    post:
      operationId: rekey
      tags: [admin]
      summary: Re-encrypt every secret under a new key
      description: |
        Generates a new encryption key and re-seals every secret under it, then
        records it as the key the node uses. The server keeps running throughout.

        This exists because there is otherwise no way off the key a node started
        with. It matters when a key leaks — in a backup, on an imaged disk,
        committed by accident — and as ordinary hygiene.

        **No workload is redeployed.** A rekey changes how a value is stored, not
        what it is, so no secret's revision moves and no specification hash with
        it. A node that was running before this call is running the same instances
        after it.

        The rewrite is one transaction, and the new key is written to the keyring
        before anything points at it. A rekey that is interrupted therefore leaves
        every secret under the old key or every secret under the new one, with
        nothing to repair by hand.

        The key that was replaced is kept. It still opens the backups taken before
        this call, and restoring one of those needs it. `GET /api/v1/admin/backup`
        with `includeKeys` carries the whole keyring for that reason.

        Back the keyring up after this. The copy taken before it no longer opens
        anything the node holds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RekeyRequest"
      responses:
        "200":
          description: The secrets were re-encrypted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RekeyResult"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report that the server is alive
      description: |
        Answers as long as the process is serving requests. It says nothing about
        whether the server can do its job — that is what `/api/v1/ready` reports —
        so it
        suits a supervisor deciding whether to restart the process.
      responses:
        "200":
          description: The server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHealthResult"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/ready:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Report whether the server can do its job
      description: |
        Reports whether the database answers and every configured driver answered
        the most recent attempt to observe it. This is distinct from
        `/api/v1/health`: a
        server whose Docker daemon has gone away is alive but cannot converge
        container workloads, and the two need different answers.

        Driver answers are cached from the reconciler's own passes rather than
        fetched per request, so polling costs nothing and the answer is at most
        one reconcile interval plus the driver timeout old. Before the first pass
        completes, the server reports not ready.
      responses:
        "200":
          description: The server is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReadinessResult"
        "503":
          description: The server cannot currently do its job. The reasons say why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReadinessResult"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/metrics:
    get:
      operationId: getMetrics
      tags: [system]
      summary: Read the server's metrics
      description: |
        Returns the server's metrics in the Prometheus text format, ready to be
        scraped with no collector in between.

        Workload names appear as label values. Anything that can reach this port
        can already run arbitrary workloads, so the names disclose nothing new —
        but they are disclosed.

        A scraper that addresses the server by hostname must have that hostname
        in the server's `hosts` configuration, or the request is refused with a
        421. Address literals are always accepted.
      responses:
        "200":
          description: The server's metrics in Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    WorkloadName:
      name: name
      in: path
      required: true
      description: The name that identifies the workload.
      schema:
        type: string
        minLength: 1
        maxLength: 63

    VolumeName:
      name: name
      in: path
      required: true
      description: The name that identifies the volume.
      schema:
        type: string
        minLength: 1
        maxLength: 63

    ServiceName:
      name: name
      in: path
      required: true
      description: The name that identifies the service.
      schema:
        type: string
        minLength: 1
        maxLength: 63

    SecretName:
      name: name
      in: path
      required: true
      description: The name that identifies the secret.
      schema:
        type: string
        minLength: 1
        maxLength: 63

    VariableName:
      name: name
      in: path
      required: true
      description: The name that identifies the variable.
      schema:
        type: string
        minLength: 1
        maxLength: 63

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Nothing exists with the given name.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: The server failed to handle the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    WorkloadSpec:
      type: object
      description: |
        The desired state of a workload. Exactly one runtime block must be present;
        which one it is selects the driver that runs the workload.
      required: [version, name]
      properties:
        version:
          type: string
          description: The manifest schema version. Only "v1" is understood.
          examples: ["v1"]
        name:
          type: string
          description: The name that identifies the workload.
          minLength: 1
          maxLength: 63
          examples: ["example"]
        count:
          type: integer
          description: |
            How many instances of the workload to run. Omitted or zero means one.
            Each instance publishes the workload's ports on host ports of its own,
            so a count above one cannot be combined with a pinned host port — and
            an exec workload must pin every port, so its count is always one. A
            scheduled workload runs one instance by the same rule.

            On one node this buys throughput, not availability: the host is the
            failure domain, and a second instance does not survive it.
          minimum: 1
        schedule:
          $ref: "#/components/schemas/ScheduleSpec"
        labels:
          $ref: "#/components/schemas/Labels"
        ports:
          type: array
          description: |
            The ports to publish. Each entry names a port inside the workload and,
            optionally, the host port that should reach it. When the host port is
            omitted the server allocates one.

            The ports sit alongside the runtime blocks because reaching a workload is
            a question about the workload. A runtime with nothing to publish rejects
            them rather than ignoring them, so a manifest that could never work says
            so when it is applied.

            The workload reports back what the server settled on, in the same place.
          items:
            $ref: "#/components/schemas/PortMapping"
        env:
          type: object
          description: |
            Environment variables set for the workload.

            These sit alongside the runtime blocks because any runtime that runs a
            process has an environment to set. A workload starts with only what this
            names, rather than inheriting the server's own environment.
          additionalProperties:
            type: string
        volumes:
          type: array
          description: |
            What the workload mounts, and where it finds each one.

            An entry names a volume, a secret or a variable. A volume is storage that
            outlives the workload. A mounted secret or variable is a file holding that
            value. It is one list rather than two, because a workload saying what
            appears in its filesystem is one question however the contents are
            produced.

            Each names something that must already exist. A specification naming what
            does not is rejected, so a mistyped name is reported rather than quietly
            becoming a second empty volume or an empty file.

            Like ports, these sit alongside the runtime blocks: where a workload
            keeps its data is a question about the workload rather than about the
            runtime it happens to use.
          items:
            $ref: "#/components/schemas/VolumeMount"
        restart:
          $ref: "#/components/schemas/RestartSpec"
        health:
          $ref: "#/components/schemas/HealthSpec"
        resources:
          $ref: "#/components/schemas/ResourcesSpec"
        container:
          $ref: "#/components/schemas/ContainerSpec"
        exec:
          $ref: "#/components/schemas/ExecSpec"

    ContainerSpec:
      type: object
      description: |
        The container runtime block, run by the docker driver.

        Every container is created with the no-new-privileges option set, so a
        process inside cannot gain privileges through a setuid binary. It is not a
        field, because it breaks essentially nothing that is not already doing
        something suspect, and a knob nobody should turn is surface for free.
      required: [image]
      properties:
        image:
          type: string
          description: The image reference to run.
          minLength: 1
          examples: ["example/example:latest"]
        pull:
          $ref: "#/components/schemas/PullPolicy"
        command:
          type: array
          description: |
            The command to run, replacing the one the image declares. Given as the
            command and its arguments rather than as a string, so nothing has to
            decide where to split it and no shell is involved.

            Leave it out to run what the image already declares, which is the usual
            case.
          items:
            type: string
            minLength: 1
          examples: [["sh", "-c", "echo hello"]]
        user:
          type: string
          description: |
            The user to run the container's process as, replacing the one the image
            declares. Given in the forms docker accepts, such as a name, a numeric
            identifier, or a "user:group" pair.

            Leave it out to run as the user the image already declares, which for
            many stock images is root.
          minLength: 1
          examples: ["65532:65532"]
        readOnly:
          type: boolean
          description: |
            Whether the container's root filesystem is read-only. Mounted volumes
            and mounted values are separate mounts with rules of their own, so they
            stay writable and readable whatever this says.

            Leave it out for a writable root filesystem, which is what most images
            expect.
        capAdd:
          type: array
          description: |
            Kernel capabilities to grant the container beyond the runtime's default
            set, named as docker names them.
          items:
            type: string
            minLength: 1
          examples: [["NET_ADMIN"]]
        capDrop:
          type: array
          description: |
            Kernel capabilities to remove from the runtime's default set, named as
            docker names them. Dropping ALL and adding back what the workload needs
            is the hardened configuration, and is opt-in because it breaks too many
            stock images to be a reasonable default.
          items:
            type: string
        pidMode:
          type: string
          enum: [host]
          description: |
            The pid namespace the container runs in, spelled the way docker
            spells it. Only "host" is accepted, which shares the host's
            namespace the way an exec workload always does. Absent runs the
            container in a namespace of its own.
            minLength: 1
          examples: [["ALL"]]

    PullPolicy:
      type: string
      description: |
        When the docker driver pulls the workload's image.

        `missing` pulls only when the image is not present on the host, so a tag
        that is already there is pinned until something removes it. `always` pulls
        on every start, and the image's digest is resolved from the registry and
        folded into the specification hash — so a rebuilt tag reads as an ordinary
        specification change and replaces the instance. `never` refuses to pull at
        all, and starting fails when the image is absent.

        The digest behind `always` is resolved when the server computes the hash: an
        apply, a changed secret or variable, or a port reallocation. It is not
        watched continuously, so a rebuilt tag is picked up when one of those
        happens rather than on a timer. Resolution carries the credentials the
        host's docker credential file holds for the registry, so a private image
        resolves wherever a docker pull on the host would.
      enum:
        - always
        - missing
        - never
      default: missing

    ResourcesSpec:
      type: object
      description: |
        The resource limits the workload runs under. A limit that is not named is
        not applied, so an empty section means what leaving it out means: unlimited.

        It sits alongside the runtime blocks because how much a workload may consume
        is a question about the workload, and the limits mean the same thing on
        either runtime. A container's are enforced by its own runtime. An exec
        workload's are enforced with a cgroup of its own, which needs the host to
        delegate a cgroup subtree to takt — running the server under systemd with
        Delegate=yes grants one. A host without one refuses the apply rather than
        accepting limits that would silently never apply.
      properties:
        memory:
          type: string
          description: |
            The most memory the workload may use, written as a size such as "512m"
            or "1g". The limit is hard: it covers swap as well, so the workload is
            killed at the limit rather than swapping past it.
          examples: ["512m"]
        cpu:
          type: number
          format: double
          description: |
            The most CPU the workload may use, in cores. Fractions are allowed, so
            0.5 is half a core.
          exclusiveMinimum: 0
          examples: [0.5]
        pids:
          type: integer
          description: The most processes and threads the workload may create.
          minimum: 1
          examples: [100]

    ScheduleSpec:
      type: object
      description: |
        When a workload runs, rather than running it continuously.

        A scheduled workload runs at the times its expression names and waits in
        between. It is not started when it is applied, because a schedule says when to
        run and the moment of applying is not one of the times it names.

        The schedule outranks the restart policy. An occurrence coming due starts the
        workload whatever the last run did, so the policy paces retries between
        occurrences rather than deciding when the next one begins.
      required: [cron]
      properties:
        cron:
          type: string
          description: |
            A cron expression in the standard five-field form, read in the server's
            local time.
          examples: ["*/5 * * * *", "0 2 * * *"]
        overlap:
          $ref: "#/components/schemas/OverlapPolicy"

    OverlapPolicy:
      type: string
      description: |
        What the server does when an occurrence comes due and the previous run has not
        finished.

        `replace` stops the running instance and starts the occurrence, so the schedule
        is always honoured and a run that outlasts its interval never finishes.
        `skip` leaves the running instance alone and misses the occurrence, which is
        what a job that must not be interrupted wants.

        Either way the workload runs one instance at a time.
      enum:
        - replace
        - skip
      default: replace

    RestartSpec:
      type: object
      description: |
        What the server does when a workload's instance ends, and how hard it tries.
      properties:
        policy:
          $ref: "#/components/schemas/RestartPolicy"
        attempts:
          type: integer
          description: |
            How many consecutive restarts to attempt before giving up. Unset means
            takt keeps trying, which is what a long-running service wants.

            A workload that gives up is left as it ended. Changing its specification
            starts it again.
          minimum: 1
          examples: [5]
        delay:
          type: string
          description: |
            How long to wait before the first restart. Each consecutive failure
            doubles the wait, up to a ceiling the server sets.
          default: 1s
          examples: ["10s"]

    RestartPolicy:
      type: string
      description: |
        What the server does when a workload's instance ends.

        `always` restarts it whatever the exit code, which is what a long-running
        service wants. `on-failure` restarts it only when it exited non-zero, so a
        workload that exits cleanly has finished its work and is left alone.
        `never` leaves it alone whatever the exit code.

        A workload the server will not restart reads as completed. Changing the
        specification runs it again, because the instance that ran is then out of
        date. Applying an unchanged specification does nothing, so a repeated apply
        does not run a completed workload a second time.

        The policy sits alongside the runtime blocks because whether a workload
        should run again is a question about the workload rather than about the
        runtime that ran it.
      enum:
        - always
        - on-failure
        - never
      default: always

    HealthSpec:
      type: object
      description: |
        How the server decides whether a workload is working, rather than merely
        started. Without one, a workload counts as running as soon as its runtime
        reports it started, which says nothing about whether the process inside is
        able to serve.

        The check is performed by the server against the workload's published
        address, not by the runtime inside the workload, so it needs nothing
        installed alongside the process and works for an image carrying no shell.

        It sits alongside the runtime blocks rather than inside one because whether a
        workload is working is a question about the workload. Which fields apply
        does depend on the runtime, and a probe a runtime cannot perform is rejected
        rather than ignored.
      properties:
        http:
          type: string
          description: |
            The path to request. The workload is healthy when the request answers
            with a 2xx status. Requires the workload to publish exactly one port, or
            for `port` to name which of several to use.
          examples: ["/healthz"]
        tcp:
          type: boolean
          description: |
            Whether to check that the port merely accepts a connection, for a
            workload that speaks something other than HTTP.
        port:
          type: string
          description: |
            Which of the workload's ports to check, written either as the name the
            specification gave it or as the port inside the workload. Only needed
            when the workload publishes more than one.

            A string rather than a number so that both forms are one field. A port
            name may not read as a number, so the two can never describe the same
            port.
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          maxLength: 63
          examples: ["http"]
        interval:
          type: string
          description: How often to perform the check.
          default: 10s
          examples: ["10s"]
        timeout:
          type: string
          description: How long a single check may take before it counts as failed.
          default: 2s
          examples: ["2s"]
        retries:
          type: integer
          description: |
            How many consecutive failures mark the workload as failed. Until that
            many have accumulated the workload is reported as pending rather than
            failed, so a check that fails once does not cause a replacement.
          default: 3
          minimum: 1
        startPeriod:
          type: string
          description: |
            How long after starting to allow before failures are counted. A workload
            that takes time to become ready would otherwise be replaced for failing
            checks it was never going to pass yet.
          default: 30s
          examples: ["30s"]

    PortMapping:
      type: object
      description: |
        A port to publish. The `to` port is the one the workload listens on inside
        its runtime. The `from` port is the one on the host that reaches it.

        Leaving `from` unset asks the server to allocate a host port, which is the
        usual case: the workload keeps a fixed port of its own and callers discover
        the allocated one from the workload's instances. Setting it pins the host
        port, which is worth doing only when something outside takt has to know the
        address in advance.
      required: [to]
      properties:
        name:
          type: string
          description: |
            What this port is called, so that the rest of a manifest can refer to it
            rather than restate the number. A health check names one this way, and so
            does another workload reaching this one.

            Optional, and only worth setting for a workload publishing more than one
            port. Two ports may share a name only when they publish the same `to` on
            different protocols, which is how one service published over TCP and UDP
            is named once.
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          maxLength: 63
          examples: ["http"]
        to:
          type: integer
          description: The port the workload listens on inside its runtime.
          minimum: 1
          maximum: 65535
          examples: [8080]
        from:
          type: integer
          description: |
            The host port that reaches `to`. Allocated by the server when unset.
          minimum: 1
          maximum: 65535
          examples: [4141]
        protocol:
          $ref: "#/components/schemas/Protocol"

    Protocol:
      type: string
      description: |
        The transport protocol a port is published on.

        The two are separate address spaces. 20000/tcp and 20000/udp are unrelated
        ports, so a workload may publish the same port on both, and the server
        allocates each of them independently. A workload publishing one port on both
        protocols is given the same host port for each when it allocates them.

        Only a TCP port can be checked. A connection to a UDP port always succeeds,
        so it reports nothing about the workload, and a specification whose health
        check has no TCP port to name is rejected.
      enum:
        - tcp
        - udp
      default: tcp

    ResolvedPort:
      type: object
      description: |
        A port mapping as it was actually applied, with the host port the server
        settled on. This is what a caller uses to reach a workload.
      required: [to, from, protocol, dynamic]
      properties:
        instance:
          type: integer
          description: |
            The index of the workload instance the port reaches. Omitted for the
            first instance, so a workload running one instance reads as it always
            did.
          minimum: 0
        name:
          type: string
          description: |
            What the specification called this port. Empty for one it did not name.
          maxLength: 63
        to:
          type: integer
          description: The port the workload listens on inside its runtime.
          minimum: 1
          maximum: 65535
        from:
          type: integer
          description: The host port that reaches it.
          minimum: 1
          maximum: 65535
        protocol:
          $ref: "#/components/schemas/Protocol"
        dynamic:
          type: boolean
          description: |
            Whether the host port was allocated by the server rather than pinned by
            the specification. A dynamic port is stable for the life of the workload
            but may be reallocated if it turns out to be unusable.

    VolumeMount:
      type: object
      description: |
        Something to mount, and the path at which the workload finds it.

        Exactly one of `name`, `secret`, `var` or `path` must be present, and which
        one it is decides what appears at the path. `name` mounts a volume, which is
        a directory that outlives the workload. `secret` and `var` mount a file
        holding what the server holds under that name, so a value an operator keeps
        in takt can be read by a workload that wants a file rather than an
        environment variable. `path` mounts a host file or directory the server does
        not manage, and only a path the server's configuration allows is accepted.

        The source is derived from the field that is present rather than from a
        discriminator, as a specification's runtime is.

        `to` is written the same way for either runtime, so a workload moved between
        them keeps its manifest. Where it resolves to differs, because a container has
        a filesystem of its own and a process on the host does not.

        For a container it is the path inside the container, and the workload uses it
        as written.

        For an exec workload it is placed inside that workload's working directory, so
        `to: /var/lib/example` puts the volume at `var/lib/example` relative to where
        the process starts. **Such a workload has to reach it by the relative path.**
        Making the absolute one resolve there would need the process to be confined to
        its directory, which needs privileges takt does not have, so an absolute path
        in a command reaches the host's own root instead.

        Either way nothing tells the workload where the mount sits on the host, which
        for an exec workload would be takt's own layout.
      required: [to]
      properties:
        name:
          type: string
          description: |
            The volume to mount, which must already exist.
          minLength: 1
          maxLength: 63
          examples: ["example-data"]
        secret:
          type: string
          description: |
            The secret to mount as a file, which must already exist. The file holds
            the secret's value and nothing else.

            This is the option for a secret that is a file — a certificate, a key, a
            credentials document — rather than a value that fits in an environment
            variable. It necessarily writes the plaintext to the host filesystem,
            where an `env` reference does not, so it is a choice worth making
            knowingly.
          minLength: 1
          maxLength: 63
          examples: ["tls-cert"]
        var:
          type: string
          description: |
            The variable to mount as a file, which must already exist. The file holds
            the variable's value and nothing else.
          minLength: 1
          maxLength: 63
          examples: ["app-config"]
        path:
          type: string
          description: |
            The host file or directory to mount, written as an absolute path. This
            is how a workload reaches data the server does not manage: a media
            library on its own mount point, or the docker socket.

            A host path reaches outside server-managed state, so the server accepts
            one only when it is under a prefix its `workload.allow-host-paths`
            configuration names. An unconfigured server refuses every path mount.
          minLength: 1
          examples: ["/mnt/media"]
        readOnly:
          type: boolean
          description: |
            Whether the workload may only read what is mounted. Applies to any
            source, so a shared volume can be handed to a workload that should not
            change it and a mounted secret cannot be altered through the mount.

            Container workloads only. The exec runtime mounts through a symbolic
            link, which cannot make anything read-only, so it rejects the field
            rather than ignoring it.
        signal:
          $ref: "#/components/schemas/MountSignal"
        to:
          type: string
          description: |
            Where the workload finds what is mounted. Must be an absolute path, and
            not `/` itself.
          minLength: 1
          examples: ["/var/lib/example"]
        from:
          type: string
          readOnly: true
          description: |
            Where the volume's data is on the host, resolved by the server from the
            named volume. Ignored when a specification is submitted, and absent for a
            mounted secret, variable or host path.

            It is stored with the workload, as an allocated host port is, so that the
            runtime is given a path rather than a name to look up. Because it is part
            of the stored specification it is covered by the hash, so a volume whose
            path changed replaces the instances bound to the old one.

            A mounted value carries none. Where the server writes the file is its own
            layout and changes with every version of the workload, so storing it would
            move the hash for a reason the operator did not ask for.
          examples: ["/home/user/.local/share/takt/volumes/cvhs0dq0kqj4c9r8m1a0"]

    MountSignal:
      type: string
      description: |
        The signal to send the workload when a mounted secret or variable changes,
        rather than replacing its instance.

        Without one, a change is delivered the way a change to a referenced secret is:
        the specification's hash moves and the instance is replaced, which is what a
        workload that reads a file once at startup needs. With one, the server rewrites
        the file in place and signals the workload, so a process that rereads its
        configuration keeps its connections and its uptime through a rotation.

        Only a signal a program reloads on can be named. One that would stop the
        workload is refused, because whether a workload runs is the server's decision
        to make through the restart policy.

        Only a mounted secret or variable may name one. A volume holds whatever the
        workload puts there, so there is no change the server could report.
      enum:
        - SIGHUP
        - SIGUSR1
        - SIGUSR2

    VolumeSpec:
      type: object
      description: |
        The desired state of a volume: a name, and what the directory backing it
        looks like to the workloads writing into it.
      required: [version, name]
      properties:
        version:
          type: string
          description: The manifest schema version. Only "v1" is understood.
          examples: ["v1"]
        name:
          type: string
          description: The name that identifies the volume.
          minLength: 1
          maxLength: 63
          examples: ["example-data"]
        labels:
          $ref: "#/components/schemas/Labels"
        owner:
          type: string
          description: |
            Who owns the volume's directory, written as a numeric "uid" or
            "uid:gid". This is what lets an image running as a fixed non-root user
            write to the volume it mounts. Absent leaves the directory owned by the
            user running the server.

            Numeric on purpose: a name would resolve against the host's user
            database, so the same manifest would mean different users on different
            hosts. Assigning another user needs the server to carry CAP_CHOWN.
          pattern: "^[0-9]+(:[0-9]+)?$"
          examples: ["470:470"]
        mode:
          type: string
          description: |
            The permission bits on the volume's directory, written as an octal
            string such as "0755". Up to four digits, so a shared volume can carry
            the setgid bit. Absent leaves the directory readable only by the user
            running the server.
          pattern: "^[0-7]{1,4}$"
          examples: ["0755"]

    Volume:
      type: object
      description: |
        A volume, together with the workloads currently mounting it.
      required: [name, createdAt]
      properties:
        name:
          type: string
          description: The name that identifies the volume.
        path:
          type: string
          description: |
            Where the volume's data is on the host, which is what something taking a
            backup needs.

            Reported to a caller of this API and not to the workloads mounting the
            volume. An operator asking takt where data lives has a reason to know.
            A workload told where it sits inside takt's data directory could walk
            out of it.
        createdAt:
          type: string
          format: date-time
          description: When the volume was created.
        usedBy:
          type: array
          description: |
            The names of the workloads whose specifications mount this volume. Empty
            for a volume nothing is using, which is a volume that can be deleted
            without forcing.
          items:
            type: string
        labels:
          $ref: "#/components/schemas/Labels"
        owner:
          type: string
          description: |
            Who owns the volume's directory, as a numeric "uid" or "uid:gid".
            Absent when the directory is owned by the user running the server.
        mode:
          type: string
          description: |
            The permission bits on the volume's directory, as an octal string.
            Absent when the directory keeps the default, readable only by the user
            running the server.

    ServiceSpec:
      type: object
      description: |
        The desired state of a service: a name, and the selection of workload
        instances it balances requests across.
      required: [version, name, target]
      properties:
        version:
          type: string
          description: The manifest schema version. Only "v1" is understood.
          examples: ["v1"]
        name:
          type: string
          description: |
            The name that identifies the service. The name "stream" is reserved.
          minLength: 1
          maxLength: 63
          examples: ["example"]
        labels:
          $ref: "#/components/schemas/Labels"
        target:
          $ref: "#/components/schemas/ServiceTarget"

    ServiceTarget:
      type: object
      description: |
        What a service selects: the labels a workload must carry for its instances
        to be selected, and which of their ports the service addresses.
      required: [labels, port]
      properties:
        labels:
          $ref: "#/components/schemas/Labels"
          description: |
            The labels a workload must carry for its instances to be selected. A
            workload matches only when it carries every one of them, and at least
            one is required: a service selecting everything is more likely a
            mistake than an intent.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: |
            The port the selected instances listen on, written as the port inside
            the workload. Always a number rather than a port's name, because the
            selected workloads need not agree on their names.
        protocol:
          type: string
          enum: [tcp, udp]
          description: The transport protocol of the port. Omitted means tcp.

    Service:
      type: object
      description: |
        A service, together with the backends its target selected when the
        response was written.
      required: [name, target, createdAt, updatedAt]
      properties:
        name:
          type: string
          description: The name that identifies the service.
        labels:
          $ref: "#/components/schemas/Labels"
        target:
          $ref: "#/components/schemas/ServiceTarget"
        backends:
          type: array
          description: |
            The selected instances that are fit to serve: observed running,
            passing their check when the workload declares one, and not being
            torn down. Absent when nothing selected is fit to serve, which is
            also what a target selecting nothing reports.
          items:
            $ref: "#/components/schemas/ServiceBackend"
        createdAt:
          type: string
          format: date-time
          description: When the service was created.
        updatedAt:
          type: string
          format: date-time
          description: When the service was last modified.

    ServiceBackend:
      type: object
      description: One address a service balances requests across.
      required: [workload, instance, address]
      properties:
        workload:
          type: string
          description: The name of the workload the instance belongs to.
        instance:
          type: integer
          description: The index of the instance among the workload's instances.
        address:
          type: string
          description: |
            The host address that reaches the instance's target port, as
            "host:port".
          examples: ["203.0.113.10:20000"]

    SecretSpec:
      type: object
      description: |
        The value to store as a secret.

        The name is not part of this. It travels in the path, because unlike a
        workload or a volume a secret is not described by a manifest: there is nothing
        to write down but the value, and writing that down is what a secret exists to
        avoid.
      required: [value]
      properties:
        value:
          type: string
          description: |
            The value to store. Stored encrypted and never returned by this API.

            An empty string is a valid value. A workload reading it gets an empty
            environment variable, which is different from one that is not set.
        labels:
          $ref: "#/components/schemas/Labels"

    Secret:
      type: object
      description: |
        A secret, together with the workloads currently reading it.

        There is no value on this schema, on purpose. Nothing reads a secret back out
        of takt: once set, the only thing that sees the value is a workload being
        started.
      required: [name, revision, createdAt, updatedAt]
      properties:
        name:
          type: string
          description: The name that identifies the secret, and which a manifest references.
        revision:
          type: string
          description: |
            Changes whenever the secret's value changes, and never otherwise.

            Reported so that an operator can confirm a rotation landed, and so that
            two servers can be compared without either revealing anything. It says
            nothing about the value: it is random rather than derived from it, which
            is also why it cannot be used to test a guess.
          examples: ["9f2c4a1e8b7d3f6002a5c8e1b4d7f0a3"]
        createdAt:
          type: string
          format: date-time
          description: When the secret was created.
        updatedAt:
          type: string
          format: date-time
          description: |
            When the secret last changed, by its value or its labels. Equal to
            createdAt for one that has never been touched since.

            The revision is what says the value moved. A relabel changes this and
            leaves that alone, so nothing reading the secret is replaced.
        usedBy:
          type: array
          description: |
            The names of the workloads whose specifications reference this secret.
            Empty for a secret nothing reads, which is a secret that can be deleted
            without forcing.
          items:
            type: string
        labels:
          $ref: "#/components/schemas/Labels"

    VariableSpec:
      type: object
      description: |
        The value to store as a variable.

        The name is not part of this. It travels in the path, because unlike a
        workload or a volume a variable is not described by a manifest: there is
        nothing to write down but the value.
      required: [value]
      properties:
        value:
          type: string
          description: |
            The value to store. Returned by this API, unlike a secret's.

            An empty string is a valid value. A workload reading it gets an empty
            environment variable, which is different from one that is not set.
        labels:
          $ref: "#/components/schemas/Labels"

    Variable:
      type: object
      description: |
        A variable, together with its value and the workloads currently reading it.

        The value is on this schema and there is no revision, which is where a
        variable differs from a secret. A secret reports a revision so that a
        rotation can be confirmed without revealing anything. A variable has nothing
        to hide, so its value serves that purpose directly. That also makes it the
        wrong place for anything damaging to report — a secret is what that is for.
      required: [name, value, createdAt, updatedAt]
      properties:
        name:
          type: string
          description: The name that identifies the variable, and which a manifest references.
        value:
          type: string
          description: The value the variable holds.
        createdAt:
          type: string
          format: date-time
          description: When the variable was created.
        updatedAt:
          type: string
          format: date-time
          description: |
            When the variable last changed, by its value or its labels. Equal to
            createdAt for one that has never been touched since.
        usedBy:
          type: array
          description: |
            The names of the workloads whose specifications reference this variable.
            Empty for a variable nothing reads, which is a variable that can be
            deleted without forcing.
          items:
            type: string
        labels:
          $ref: "#/components/schemas/Labels"

    ExecSpec:
      type: object
      description: |
        The exec runtime block, which runs a command on the host.

        The command is given as the command and its arguments rather than as a
        string, so nothing has to decide where to split it and no shell is involved
        unless the command names one.

        The server creates a working directory for each version of the workload and
        runs the command inside it. The command's output is captured there, which is
        what `logs` reads.
      required: [command]
      properties:
        command:
          type: array
          description: The command to run, and its arguments.
          minItems: 1
          items:
            type: string
            minLength: 1
          examples: [["/usr/local/bin/backup", "--target", "/data"]]

    Workload:
      type: object
      description: |
        A workload's desired state, together with the state observed from the driver
        that runs it.
      required: [name, version, runtime, state, spec, createdAt, updatedAt]
      properties:
        name:
          type: string
          description: The name that identifies the workload.
        version:
          type: integer
          description: |
            Incremented every time the workload's specification changes. Applying an
            unchanged specification leaves it as-is.
          minimum: 1
        runtime:
          $ref: "#/components/schemas/Runtime"
        state:
          $ref: "#/components/schemas/WorkloadState"
        spec:
          $ref: "#/components/schemas/WorkloadSpec"
        deleting:
          type: boolean
          description: |
            Whether the workload has been marked for deletion and is being torn
            down. Such a workload is reported as terminating and will disappear
            once nothing is left running for it.
        suspended:
          type: boolean
          description: |
            Whether the workload has been stopped and is intentionally not
            running. Suspension survives a server restart and holds until the
            workload is started again.
        ports:
          type: array
          description: |
            The port mappings the server settled on for this workload, including the
            host ports it allocated. These are how a caller reaches the workload, and
            are reported whether or not anything is currently running.
          items:
            $ref: "#/components/schemas/ResolvedPort"
        instances:
          type: array
          description: |
            The instances the driver is currently running for this workload. Empty
            when nothing is running yet.
          items:
            $ref: "#/components/schemas/Instance"
        createdAt:
          type: string
          format: date-time
          description: When the workload was first applied.
        updatedAt:
          type: string
          format: date-time
          description: |
            When the workload's specification last changed, or a suspended workload
            was last started. A schedule counts occurrences from this time when
            nothing has run yet.
        nextRun:
          type: string
          format: date-time
          description: |
            When the workload next runs, for one that names a schedule. Absent for a
            workload that runs continuously, and for a scheduled one that has not run
            yet and so has no occurrence to count from.

            Derived when the workload is read rather than stored, like everything else
            about what is actually happening.
        lastError:
          type: string
          description: |
            Why the last attempt to converge the workload failed. Absent for a
            workload whose last attempt succeeded, or that none has been made for.

            Held in memory rather than stored: it clears when an attempt succeeds
            and does not survive a server restart, after which the next attempt
            either fails again and restores it or succeeds. The text is for a human
            reading it, not for matching.
        lastErrorAt:
          type: string
          format: date-time
          description: |
            When the last converge failure was recorded. Present exactly when
            lastError is, so a failure an hour ago and one on every attempt read
            differently.

    Instance:
      type: object
      description: A single unit of work the driver is running for a workload.
      required: [id, state, specHash]
      properties:
        health:
          $ref: "#/components/schemas/InstanceHealth"
        id:
          type: string
          description: |
            The driver's opaque handle for this instance. A container ID for the
            docker driver.
        index:
          type: integer
          description: |
            The index of the instance among the workload's instances, counted from
            zero up to the specification's count. Each index is converged on its
            own. Omitted for the first instance.
          minimum: 0
        state:
          $ref: "#/components/schemas/InstanceState"
        specHash:
          type: string
          description: |
            The hash of the specification this instance was started from. When it
            differs from the workload's current hash, the instance is replaced.
        exitCode:
          type: integer
          description: |
            The exit code. Absent while the instance is still running, since it
            has not yet ended in any particular way.
        startedAt:
          type: string
          format: date-time
          description: When the instance last started.

    Runtime:
      type: string
      description: Which runtime block the workload's specification names.
      enum:
        - container
        - exec

    WorkloadState:
      type: string
      description: |
        The workload's overall state, derived from its instances. A workload is
        pending until something is running, running while its instances are up,
        terminating while they are being torn down, failed when an instance exited
        non-zero, and stopped when none are running.

        A completed workload has ended and will not be restarted, which its restart
        policy asked for. That is distinct from stopped, where nothing is running and
        the server intends to fix it.

        A suspended workload was stopped by an operator and stays down until it is
        started again. Neither stopped nor completed fits: the server does not
        intend to fix it, and its restart policy did not ask for it to end.

        A degraded workload runs more than one instance and has at least one up
        and at least one failed. It serves traffic, and an operator reading only
        this state still learns that part of it does not.
      enum:
        - pending
        - running
        - degraded
        - terminating
        - stopped
        - completed
        - failed
        - suspended

    InstanceHealth:
      type: object
      description: |
        The result of the workload's health check for this instance, absent when the
        workload declares no check and its runtime reports none of its own.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        failures:
          type: integer
          description: |
            How many consecutive checks have failed. Reset by a check that passes.
          minimum: 0
        checkedAt:
          type: string
          format: date-time
          description: When the check last ran.
        error:
          type: string
          description: Why the last check failed, when it did.

    HealthStatus:
      type: string
      description: |
        Whether the workload is working. An instance is starting while it is inside
        its start period or has not yet passed a check, healthy once one passes, and
        unhealthy once enough consecutive checks have failed to exhaust its retries.
      enum:
        - starting
        - healthy
        - unhealthy

    InstanceState:
      type: string
      description: |
        The state of a single instance as reported by its driver. An instance is
        terminating while it is being torn down, which happens when an outdated
        instance is replaced or its workload is deleted.

        An instance is completed when it ended and its workload's restart policy
        says not to run it again. Exited says only that it ended, which is what the
        driver observed. Completed adds what the policy makes of that.
      enum:
        - pending
        - running
        - terminating
        - exited
        - completed
        - failed

    ErrorResponse:
      type: object
      description: The body returned for any unsuccessful request.
      required: [error]
      properties:
        error:
          type: string
          description: A human-readable description of what went wrong.

    Labels:
      type: object
      description: |
        Key-value pairs attached to a workload, volume, service, secret or
        variable, which the list query filter matches against.

        Keys are lowercase alphanumeric, optionally separated by dots, dashes,
        underscores or slashes, up to 63 characters, so a key like
        app.example.com/name works. Keys with the "takt." prefix are refused: the
        server writes its own labels under it.

        Values are free text without control characters, up to 256 bytes. An empty
        value is allowed.

        The same rules everywhere. A label on a secret is as readable as the
        secret's name, which is worth knowing before putting anything in one.
      maxProperties: 32
      additionalProperties:
        type: string
        maxLength: 256

    ListWorkloadsResult:
      type: object
      description: |
        The body returned when workloads are listed.

        An object rather than a bare array, so that something later reported about a
        listing as a whole is a new field rather than a change of type.
      required: [workloads]
      properties:
        workloads:
          type: array
          description: The workloads matching the request.
          items:
            $ref: "#/components/schemas/Workload"

    GetWorkloadResult:
      type: object
      description: The body returned when a single workload is read.
      required: [workload]
      properties:
        workload:
          $ref: "#/components/schemas/Workload"

    ApplyWorkloadResult:
      type: object
      description: |
        The body returned when a workload is applied.

        Whether the workload was created or updated is the status code rather than a
        field here, since that is what the code already distinguishes.
      required: [workload]
      properties:
        workload:
          $ref: "#/components/schemas/Workload"

    DeleteWorkloadResult:
      type: object
      description: |
        The body returned when a workload is marked for deletion, holding the
        workload as it now stands.
      required: [workload]
      properties:
        workload:
          $ref: "#/components/schemas/Workload"

    StopWorkloadRequest:
      type: object
      description: |
        The body sent to stop a workload, which has nothing in it yet.

        It exists so that every write to this API carries a JSON object, and so
        that a later option is a new field rather than a new kind of request.

    StopWorkloadResult:
      type: object
      description: |
        The body returned when a workload is stopped, holding the workload as it
        now stands.
      required: [workload]
      properties:
        workload:
          $ref: "#/components/schemas/Workload"

    StartWorkloadRequest:
      type: object
      description: |
        The body sent to start a workload, which has nothing in it yet. It exists
        for the same reasons the stop body does.

    StartWorkloadResult:
      type: object
      description: |
        The body returned when a workload is started, holding the workload as it
        now stands.
      required: [workload]
      properties:
        workload:
          $ref: "#/components/schemas/Workload"

    RestartWorkloadRequest:
      type: object
      description: |
        The body sent to restart a workload, which has nothing in it yet. It
        exists for the same reasons the stop body does.

    RestartWorkloadResult:
      type: object
      description: |
        The body returned when a workload restart is recorded, holding the
        workload as it now stands.
      required: [workload]
      properties:
        workload:
          $ref: "#/components/schemas/Workload"

    DryRunWorkloadResult:
      type: object
      description: |
        What applying a specification would do, none of it having been done.
      required: [spec, created, replaced]
      properties:
        spec:
          $ref: "#/components/schemas/WorkloadSpec"
        specHash:
          type: string
          description: |
            The hash the apply would store, which is what the server compares to
            decide whether a running instance is replaced.

            Absent when a host port has yet to be allocated. The host ports reach the
            hash, so one computed before they are settled is a hash the apply never
            stores.
        created:
          type: boolean
          description: |
            Whether nothing holds the name, so applying creates the workload.
        replaced:
          type: boolean
          description: |
            Whether applying moves the stored hash, so the running instances are
            replaced.

            This is the field an operator cannot work out by reading their manifest.
            The hash covers the resolved specification along with the revision of
            every secret and the value of every variable the workload reads, so an
            apply can replace an instance because a variable moved, with nothing in
            the file to say so.

            False for a workload that does not exist, which has nothing running to
            replace.
        unknown:
          type: array
          description: |
            The paths into `spec` whose values the server settles only as it applies.
            A host port it has yet to allocate is the only one, reported rather than
            invented.

            The paths are written in the syntax the workload list query uses, so
            `$.ports[0].from` names the host port of the first mapping.
          items:
            type: string
            examples: ["$.ports[0].from"]
        changed:
          type: array
          description: |
            The paths into `spec` that differ from the specification the server
            stores, written in the same syntax as `unknown`.

            A field is named once, at the level the difference starts, so a container
            block that was added reads as `$.container` rather than as each field
            inside it. A value the server settles only as it applies is never named,
            because such a value is stored for the running workload and absent from
            the specification being reported.

            Absent for a workload that does not exist, which has nothing to differ
            from. Absent as well when `replaced` is true and nothing in the
            specification moved: the hash covers what a workload reads, so an image
            rebuilt under the same tag replaces an instance with the file untouched.
          items:
            type: string
            examples: ["$.container.image"]

    ListVolumesResult:
      type: object
      description: |
        The body returned when volumes are listed.

        An object rather than a bare array, so that something later reported about a
        listing as a whole is a new field rather than a change of type.
      required: [volumes]
      properties:
        volumes:
          type: array
          description: The volumes the server holds.
          items:
            $ref: "#/components/schemas/Volume"

    GetVolumeResult:
      type: object
      description: The body returned when a single volume is read.
      required: [volume]
      properties:
        volume:
          $ref: "#/components/schemas/Volume"

    CreateVolumeResult:
      type: object
      description: The body returned when a volume is created.
      required: [volume]
      properties:
        volume:
          $ref: "#/components/schemas/Volume"

    UpdateVolumeResult:
      type: object
      description: The body returned when a volume is updated.
      required: [volume]
      properties:
        volume:
          $ref: "#/components/schemas/Volume"

    DeleteVolumeResult:
      type: object
      description: |
        The body returned when a volume is deleted, which has nothing in it yet.

        It exists for two reasons. Every response this API gives is a JSON object, so
        a caller decoding bodies needs no branch for the one operation that would
        otherwise return nothing. And an object with no fields can gain one, where a
        response with no body cannot gain anything without becoming a different kind
        of response.

    ListServicesResult:
      type: object
      description: |
        The body returned when services are listed.

        An object rather than a bare array, so that something later reported about
        a listing as a whole is a new field rather than a change of type.
      required: [services]
      properties:
        services:
          type: array
          description: The services the server holds.
          items:
            $ref: "#/components/schemas/Service"

    GetServiceResult:
      type: object
      description: The body returned when a single service is read.
      required: [service]
      properties:
        service:
          $ref: "#/components/schemas/Service"

    ApplyServiceResult:
      type: object
      description: The body returned when a service is applied.
      required: [service]
      properties:
        service:
          $ref: "#/components/schemas/Service"

    DeleteServiceResult:
      type: object
      description: |
        The body returned when a service is deleted, which has nothing in it yet.
        It exists for the reasons DeleteVolumeResult does.

    ListSecretsResult:
      type: object
      description: |
        The body returned when secrets are listed.

        An object rather than a bare array, for the same reason listing volumes
        returns one.
      required: [secrets]
      properties:
        secrets:
          type: array
          description: The secrets the server holds.
          items:
            $ref: "#/components/schemas/Secret"

    GetSecretResult:
      type: object
      description: The body returned when a single secret is read.
      required: [secret]
      properties:
        secret:
          $ref: "#/components/schemas/Secret"

    SetSecretResult:
      type: object
      description: The body returned when a secret is set.
      required: [secret]
      properties:
        secret:
          $ref: "#/components/schemas/Secret"

    DeleteSecretResult:
      type: object
      description: |
        The body returned when a secret is deleted, which has nothing in it yet, for
        the same reason deleting a volume returns one.

    ListVariablesResult:
      type: object
      description: |
        The body returned when variables are listed.

        An object rather than a bare array, for the same reason listing volumes
        returns one.
      required: [variables]
      properties:
        variables:
          type: array
          description: The variables the server holds.
          items:
            $ref: "#/components/schemas/Variable"

    GetVariableResult:
      type: object
      description: The body returned when a single variable is read.
      required: [variable]
      properties:
        variable:
          $ref: "#/components/schemas/Variable"

    SetVariableResult:
      type: object
      description: The body returned when a variable is set.
      required: [variable]
      properties:
        variable:
          $ref: "#/components/schemas/Variable"

    DeleteVariableResult:
      type: object
      description: |
        The body returned when a variable is deleted, which has nothing in it yet, for
        the same reason deleting a secret returns one.

    RekeyRequest:
      type: object
      description: |
        The body sent to rekey a node, which has nothing in it yet. It exists for
        the same reasons the stop body does.

    RekeyResult:
      type: object
      required: [secrets, keyId, previousKeyId]
      properties:
        secrets:
          type: integer
          description: How many secrets were re-encrypted.
        keyId:
          type: string
          description: The key the node's secrets are now sealed under.
        previousKeyId:
          type: string
          description: |
            The key they were sealed under before. The keyring keeps it, because it
            still opens the backups taken before this call.

    GetHealthResult:
      type: object
      description: The body returned when the server is alive.
      required: [status]
      properties:
        status:
          type: string
          description: Always "ok". The response arriving is the answer.
          enum: [ok]

    GetReadinessResult:
      type: object
      description: |
        Whether the server can do its job, with the reasons it cannot when it
        cannot.
      required: [ready]
      properties:
        ready:
          type: boolean
          description: Whether the database and every configured driver answered.
        reasons:
          type: array
          description: Why the server is not ready. Absent when it is.
          items:
            type: string
