[http]
address = "localhost:9999"
hosts = ["orca.example.com"]
tls-cert = "/etc/orca/tls/cert.pem"
tls-key = "/etc/orca/tls/key.pem"

[data]
directory = "/var/lib/orca"

[docker]
host = "tcp://localhost:2375"
config-file = "/etc/orca/docker-config.json"

[reconcile]
interval = "30s"

[workload]
bind = "0.0.0.0"
min-port = 25000
max-port = 26000
allow-host-paths = ["/mnt/media", "/var/run/docker.sock"]

[exec]
allow-paths = ["/opt/runtime", "/nix/store"]

[secrets]
keys = "/etc/orca/keys"

[telemetry]
otlp-endpoint = "http://collector.example.com:4318"

[logging]
level = "debug"
