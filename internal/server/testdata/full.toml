[http]
address = "localhost:9999"
hosts = ["orca.example.com"]

[data]
directory = "/var/lib/orca"

[docker]
host = "tcp://localhost:2375"

[reconcile]
interval = "30s"

[workload]
bind = "0.0.0.0"
min-port = 25000
max-port = 26000

[exec]
allow-paths = ["/opt/runtime", "/nix/store"]

[secrets]
key-file = "/etc/orca/secret.key"

[logging]
level = "debug"
