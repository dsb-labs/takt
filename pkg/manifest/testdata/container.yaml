version: v1
name: example
schedule:
  cron: "*/5 * * * *"
  overlap: skip

restart:
  policy: on-failure
  attempts: 5
  delay: 10s

labels:
  some-key: some-value
ports:
  - to: 8080
    from: 4141
  - to: 9090
env:
  EXAMPLE: EXAMPLE
container:
  image: example/example:latest
  command: ["sh", "-c", "exit 0"]
