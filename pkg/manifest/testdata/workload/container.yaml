version: v1
name: example
schedule:
  cron: "*/5 * * * *"
  overlap: skip

restart:
  policy: on-failure
  attempts: 5
  delay: 10s

labels:
  some-key: some-value
ports:
  - name: http
    to: 8080
    from: 4141
  - to: 9090
env:
  EXAMPLE: EXAMPLE
volumes:
  - name: example-data
    to: /var/lib/example
resources:
  memory: 512m
  cpu: 0.5
  pids: 100
container:
  image: example/example:latest
  pull: always
  command: ["sh", "-c", "exit 0"]
  user: "65532:65532"
  readOnly: true
  capAdd: [NET_ADMIN]
  capDrop: [ALL]
