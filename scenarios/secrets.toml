name = "secrets"
description = "Rotation-heavy, so every change redeploys the workloads reading it."

# Rotating a secret moves its revision, which moves the specification hash of every
# workload reading it, which replaces their instances. A small number of secrets read
# by a large fleet is therefore the most expensive shape an operator can produce, and
# it is what found the mount reclamation leak.

[fleet]
containers = 40
exec = 40
reads-secret = 1.0
reads-variable = 1.0
mounts-secret = 0.5
mounts-variable = 0.5

[resources]
secrets = 8
variables = 8
volumes = 0

[churn]
duration = "2m"
workers = 16

[churn.weights]
rotate-secret = 6
rotate-variable = 3
get = 1
logs = 1
