name = "smoke"
description = "A few of everything, in seconds. The one to run before a commit."

[fleet]
containers = 4
exec = 4
dynamic-ports = 0.5
health-checks = 0.25
reads-secret = 1.0
reads-variable = 1.0
mounts-secret = 0.25
mounts-variable = 0.25
mounts-volume = 0.25

[resources]
secrets = 3
variables = 3
volumes = 2

[churn]
duration = "10s"
workers = 4

[churn.weights]
rotate-secret = 2
rotate-variable = 1
reapply = 2
list = 2
get = 1
logs = 1
